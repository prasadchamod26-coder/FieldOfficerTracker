name: Build Field Officer Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/fieldofficer/tracker
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FieldOfficerTracker'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.fieldofficer.tracker'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.fieldofficer.tracker'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Field Officer Tracker"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/fieldofficer/tracker/MainActivity.java <<'EOF'
          package com.fieldofficer.tracker;
          
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.JsResult;
          import android.widget.Toast;
          import android.graphics.Bitmap;
          import android.net.http.SslError;
          import android.webkit.SslErrorHandler;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          
          public class MainActivity extends Activity {
              private static final int CREATE_FILE = 1001;
              private String pendingContent = "";
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
          
                  webView.addJavascriptInterface(new DownloadBridge(), "AndroidBridge");
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("OK", (dialog, which) -> result.confirm())
                              .setOnCancelListener(dialog -> result.cancel())
                              .show();
                          return true;
                      }
          
                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, JsResult result) {
                          new AlertDialog.Builder(MainActivity.this)
                              .setMessage(message)
                              .setPositiveButton("Yes / ඔව්", (dialog, which) -> result.confirm())
                              .setNegativeButton("No / නැහැ", (dialog, which) -> result.cancel())
                              .setOnCancelListener(dialog -> result.cancel())
                              .show();
                          return true;
                      }
                  });
          
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          
              private class DownloadBridge {
                  @JavascriptInterface
                  public void saveFile(String filename, String content, String mimeType) {
                      runOnUiThread(() -> {
                          pendingContent = content;
                          String mime = mimeType == null
                              ? "application/octet-stream" : mimeType.split(";")[0];
                          Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType(mime);
                          intent.putExtra(Intent.EXTRA_TITLE, filename);
                          startActivityForResult(intent, CREATE_FILE);
                      });
                  }
              }
          
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == CREATE_FILE && resultCode == RESULT_OK && data != null) {
                      Uri uri = data.getData();
                      try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                          if (out != null) {
                              out.write(pendingContent.getBytes(StandardCharsets.UTF_8));
                              Toast.makeText(this, "ගොනුව සුරැකුණා", Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception e) {
                          Toast.makeText(this, "ගොනුව සුරැකීමට නොහැකි වුණා", Toast.LENGTH_LONG).show();
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldOfficerTracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
